name: Render site

on:
  push:
    paths:
      - 'submissions.json'
      - 'digests/**/*.json'
      - 'catchups/**/*.json'
      - 'catchup-2026-ytd.json'
      - 'scripts/render.js'
      - '.github/workflows/render.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # full history so the rebase-retry below can resolve against origin
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run renderer
        run: node scripts/render.js

      - name: Commit rendered site
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions Renderer"
          git add index.html submissions.html digests/*.html catchups/*.html catchup-2026-ytd.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No HTML changes to commit."
          else
            git commit -m "render: update site"
            # the digest agent may push while a render is in flight; rebase and retry
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "push rejected (attempt $attempt/3), rebasing on origin/$GITHUB_REF_NAME"
              git pull --rebase origin "$GITHUB_REF_NAME"
            done
            echo "push failed after 3 attempts" >&2
            exit 1
          fi
